name: Build product photos (one-off)

on:
  push:
    branches: [main]
    paths: [".github/workflows/abtap-photos.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install --quiet opencv-contrib-python-headless pillow numpy
          curl -sSfL -o EDSR_x2.pb https://raw.githubusercontent.com/Saafke/EDSR_Tensorflow/master/models/EDSR_x2.pb
          curl -sSfL -o Inter.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf"
      - name: Build photos
        run: |
          cat > "$RUNNER_TEMP/process_images.py" <<'PY'
          """Builds the site's product photos from the original PNGs in public/images.

          Crops each photo (including single cells of the two grid images) to the card
          ratio used on the page, upscales the small ones 2x with EDSR, bakes the
          "W praktyce" captions into the three gallery photos, writes sharp JPEGs under
          the file names the components already use, then removes the source PNGs.
          """
          import os, sys, glob
          import numpy as np
          import cv2
          from PIL import Image, ImageDraw, ImageFilter, ImageFont

          IMG = "public/images"
          FAST = os.environ.get("FAST") == "1"  # local smoke test: skip the slow AI upscale

          # Original uploads (as committed) -> short keys
          SOURCES = {
              "S1": "obraz_2026-09-21_112756865 (3).png",   # hero stand, 400x500
              "S2": "obraz_2026-09-21_112633371.png",       # grid of 8 stands
              "S3": "obraz_2026-09-21_112709265 (1).png",   # grid of 6 plates
              "S4": "obraz_2026-09-21_112542000 (1).png",   # white stand, cosmetics
              "S5": "obraz_2026-09-21_112526545 (2).png",   # restaurant
              "S6": "obraz_2026-09-21_112450566 (2).png",   # salon reception
              "S7": "tabliczka z telefonem (2).png",        # phone tapping plate
          }
          # name: (source, crop box in source px, output size, trim grid gutter edges)
          CROPS = {
              "hero":                         ("S1", (0, 0, 400, 500),        (800, 1000), False),
              "product-tabliczka":            ("S3", (592, 70, 1060, 538),    (800, 800),  True),
              "product-stojak":               ("S2", (379, 560, 763, 944),    (800, 800),  True),
              "personalizacja-czarny":        ("S2", (0, 586, 374, 960),      (800, 800),  True),
              "personalizacja-bialy":         ("S4", (310, 100, 1230, 1020),  (800, 800),  False),
              "personalizacja-przezroczysty": ("S2", (769, 560, 1151, 942),   (800, 800),  True),
              "practice-restauracje":         ("S5", (20, 0, 507, 609),       (800, 1000), False),
              "practice-salony":              ("S6", (425, 0, 1223, 997),     (800, 1000), False),
              "practice-dotkniecie":          ("S7", (150, 0, 1153, 1254),    (800, 1000), False),
          }
          CAPTIONS = {
              "practice-restauracje": ("Restauracje i kawiarnie", "Stojak przy rachunku lub ladzie."),
              "practice-salony":      ("Salony i recepcje",       "Elegancki akcent w punkcie obsługi."),
              "practice-dotkniecie":  ("Jedno dotknięcie",        "Bez szukania firmy w Google."),
          }


          def save(im, path):
              im.save(path, "JPEG", quality=90, subsampling=0, progressive=True, optimize=True)


          def font(size, weight):
              f = ImageFont.truetype("Inter.ttf", size)
              f.set_variation_by_axes([min(max(size / 2.35, 14), 32), weight])
              return f


          def bake_caption(im, title, caption):
              S = im.width / 340.0  # image px per CSS px of a ~340px wide card
              W, H = im.size
              inset, pad_x, pad_y = round(22 * S), round(17 * S), round(14 * S)
              ft, fc = font(round(16 * S), 600), font(round(13.5 * S), 400)
              th, ch, gap = ft.getbbox("ÁgjŻ")[3], fc.getbbox("ÁgjŻ")[3], round(3 * S)
              box = (inset, H - inset - (pad_y * 2 + th + gap + ch), W - inset, H - inset)
              mask = Image.new("L", im.size, 0)
              ImageDraw.Draw(mask).rounded_rectangle(box, round(16 * S), fill=255)
              tint = Image.blend(im.filter(ImageFilter.GaussianBlur(12 * S)), Image.new("RGB", im.size, (0, 0, 0)), 0.55)
              im = Image.composite(tint, im, mask)
              d = ImageDraw.Draw(im)
              d.text((box[0] + pad_x, box[1] + pad_y), title, font=ft, fill=(255, 255, 255))
              d.text((box[0] + pad_x, box[1] + pad_y + th + gap), caption, font=fc, fill=(205, 205, 205))
              return im


          def main():
              missing = [f for f in SOURCES.values() if not os.path.exists(os.path.join(IMG, f))]
              if missing:
                  print("Source PNGs not found (already processed?):", missing)
                  sys.exit(0)
              src = {k: Image.open(os.path.join(IMG, f)).convert("RGB") for k, f in SOURCES.items()}
              sr = None
              if not FAST:
                  sr = cv2.dnn_superres.DnnSuperResImpl_create()
                  sr.readModel("EDSR_x2.pb")
                  sr.setModel("edsr", 2)
              for name, (key, box, (tw, th), trim) in CROPS.items():
                  im = src[key].crop(box)
                  if im.width < tw * 0.9 and sr is not None:
                      up = sr.upsample(cv2.cvtColor(np.asarray(im), cv2.COLOR_RGB2BGR))
                      im = Image.fromarray(cv2.cvtColor(up, cv2.COLOR_BGR2RGB))
                  im = im.resize((tw, th), Image.LANCZOS)
                  if trim:  # grid cells: drop the light gutter line at the edges
                      im = im.crop((8, 8, tw - 8, th - 8)).resize((tw, th), Image.LANCZOS)
                  if name in CAPTIONS:
                      im = bake_caption(im, *CAPTIONS[name])
                  save(im, os.path.join(IMG, f"{name}.jpg"))
                  print("wrote", name, flush=True)
              for f in SOURCES.values():
                  os.remove(os.path.join(IMG, f))
              print("removed source PNGs")


          if __name__ == "__main__":
              main()
          PY
          python "$RUNNER_TEMP/process_images.py"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/images
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Replace product photos with sharp versions built from the originals"
          git pull --rebase origin main
          git push origin HEAD:main
